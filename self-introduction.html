<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 - 江藤美空</title>
</head>
<body>
    <h1>自己紹介</h1>
    <h2>プロフィール</h2>
    <div>
        <p>名前: 江藤美空</p>
        <p>年齢: 23</p>
        <p>出身地: 静岡県</p>
        <p>趣味: ハンドメイド、箏</p>
    </div>
    <h2>好きなもの</h2>
    <ul>
        <li>トマト</li>
        <li>もも</li>
        <li>いちご</li>
    </ul>
    <h2>今年の目標</h2>
    <ol>
        <li>ポートフォリオ作成</li>
        <li>転職する</li>
        <li>健康第一</li>
    </ol>
    <h2>リンク</h2>
    <div>
        <a href="https://github.com/" target="_blank">私のGitHub</a>
    </div>
    <h2>好きな風景</h2>
    <div>
        <img src="landscape.jpg" alt="好きな風景" width="400">
    </div>
    <h2>お問い合わせ</h2>
    <form action="/submit" method="post">
        <div>
            <label for="name">お名前: </label>
            <input type="text" id="name" required>
        </div>
        <div>
            <label for="select">お問い合わせ種別: </label>
            <select name="" id="select">
                <option value="">--選択してください--</option>
                <option value="">一般的なお問い合わせ</option>
                <option value="">ご意見・ご要望</option>
            </select>
        </div>
        <div>
            <label for="content">お問い合わせ内容: </label>
            <textarea name="" id="content" required></textarea>
        </div>
        <div>
            <button type="submit">送信する</button>
        </div>
    </form>
</body>
</html>
